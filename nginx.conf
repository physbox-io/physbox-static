# Optimized Nginx Configuration for Static Site Hosting on Google Cloud Run
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Performance optimizations for serving static files
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Enable Gzip compression for ultra-fast asset delivery
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    server {
        # Google Cloud Run routes external traffic to port 8080 by default
        listen 8080;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Serve static assets with long-term cache control headers for performance
        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
            expires 1M;
            access_log off;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # Route matching for standard URLs (falls back to index.html for client-side routing)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Custom error handling redirects to main landing page
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
