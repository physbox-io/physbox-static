# Optimized Nginx Configuration for Static Site Hosting on Google Cloud Run
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # Performance optimizations for serving static files
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Enable Gzip compression for ultra-fast asset delivery
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    server {
        # Google Cloud Run routes external traffic to port 8080 by default
        listen 8080;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Baseline security headers evaluated by enterprise SWG / CCI scanners.
        # Repeated in locations that set Cache-Control because Nginx does not
        # inherit server-level add_header into locations with their own add_header.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # expt.in is a legacy domain that's still indexed by Google; redirect
        # it (and its www variant) permanently to physbox.io instead of just
        # dropping the mapping, so search rankings carry over.
        if ($host ~* ^(www\.)?expt\.in$) {
            return 301 https://physbox.io$request_uri;
        }

        # Never serve dotfiles (.git, .claude, etc.), except RFC 8615 /.well-known/
        location ~ /\.(?!well-known(?:/|$)) {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Immutable long-term caching for media and fonts (their URLs never change content)
        location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
            expires 1M;
            access_log off;
            add_header Cache-Control "public, max-age=2592000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        # CSS/JS are cache-busted by a ?v= query string in the HTML, so the browser
        # must always revalidate the bare URL. Without this a stale stylesheet can
        # survive a deploy for a month and the site renders with old layout rules.
        location ~* \.(?:css|js)$ {
            add_header Cache-Control "public, no-cache, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        # Never let HTML go stale: it is what carries the current ?v= asset URLs.
        location ~* \.html$ {
            add_header Cache-Control "no-cache, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        }

        # Clean extensionless URLs (/privacy -> /privacy.html, /terms -> /terms.html)
        # while returning a real 404 on unknown paths instead of a soft-200 catch-all,
        # which security/categorization crawlers flag as parked/catch-all behaviour.
        location / {
            add_header Cache-Control "no-cache, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            try_files $uri $uri.html $uri/ =404;
        }

        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
