<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Assistance | PhysBox Cloud</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .auth-card-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: radial-gradient(circle at 50% 30%, rgba(139, 92, 246, 0.12) 0%, rgba(5, 6, 8, 1) 80%);
    }
    .auth-card {
      background: rgba(13, 17, 28, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      max-width: 460px;
      width: 100%;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="auth-card-container">
    <div class="auth-card">
      <h2 style="font-family:'Outfit', sans-serif; font-size:1.8rem; margin-bottom:1rem; color:#fff;">
        <i class="fa-solid fa-key text-violet-400"></i> Password-Free Authentication
      </h2>
      <p style="color:var(--text-secondary); line-height:1.6; margin-bottom:2rem;">
        PhysBox Cloud utilizes <strong>Google Identity Services (OAuth 2.0)</strong>. You do not need a password to access PhysBox! Simply log in securely with your Google account.
      </p>
      <a href="login.html" class="btn-primary-glow" style="display:inline-block; padding:0.85rem 1.75rem; text-decoration:none;">
        <i class="fa-brands fa-google"></i> Sign In with Google
      </a>
    </div>
  </div>
</body>
</html>
